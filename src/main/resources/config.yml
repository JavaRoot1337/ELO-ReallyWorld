# бд: sqlite или mysql
storage:
  type: sqlite
  # для mysql
  host: localhost
  port: 3306
  database: elo
  user: root
  password: ""
  pool-size: 6

# победа
elo-win: 15
# поражение
elo-loss: 15
# старт
elo-default: 1000
# границы рейтинга
elo-min: 0
elo-max: 100000

# кд на повторное убийство (сек, 0 - выкл)
kill-cooldown-sec: 300

# обн топа (сек)
top-update-sec: 60
# строк в топе
top-limit: 10
# автосейв (сек)
autosave-sec: 60

# только дуэли
only-duels: false

# ранги
ranks:
  1250: "&aНовичок"
  1500: "&cПрофи"
  1750: "&cМастер"
  2000: "&4Легенда"
# дефолт ранг
default-rank: "&6Феномен"
